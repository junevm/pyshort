services:
  db:
    image: docker.io/library/postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: host
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "for i in {1..30}; do
             pg_isready -h localhost -U urlshortener >/dev/null 2>&1 && break;
             echo 'Waiting for db...';
             sleep 1;
             done &&
             python manage.py migrate --settings=urlshortener.settings &&
             gunicorn urlshortener.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=urlshortener.settings
      - SECRET_KEY=dev-secret-key
      - DEBUG=True
      - POSTGRES_DB=urlshortener
      - POSTGRES_USER=urlshortener
      - POSTGRES_PASSWORD=urlshortener
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=5432
    depends_on:
      - db
    network_mode: host

volumes:
  postgres_data:
